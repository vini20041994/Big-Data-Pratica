services:
  scylla-node1:
    image: scylladb/scylla:5.2.0
    container_name: scylla-node1
    command: --seeds=scylla-node1 --smp 1 --memory 1G --overprovisioned 1 --alternator-port 8000 --alternator-write-isolation only_rmw_uses_lwt
    networks:
      - dynamo-ring
    healthcheck:
      # Valida o motor CQL E o endpoint Alternator. O Alternator NAO faz bind em
      # 127.0.0.1: escuta apenas no IP do container, dai o `hostname -i`.
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES;' && curl -sf http://$$(hostname -i):8000 -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  scylla-node2:
    image: scylladb/scylla:5.2.0
    container_name: scylla-node2
    command: --seeds=scylla-node1 --smp 1 --memory 1G --overprovisioned 1 --alternator-port 8000 --alternator-write-isolation only_rmw_uses_lwt
    networks:
      - dynamo-ring
    depends_on:
      scylla-node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES;' && curl -sf http://$$(hostname -i):8000 -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  scylla-node3:
    image: scylladb/scylla:5.2.0
    container_name: scylla-node3
    command: --seeds=scylla-node1 --smp 1 --memory 1G --overprovisioned 1 --alternator-port 8000 --alternator-write-isolation only_rmw_uses_lwt
    networks:
      - dynamo-ring
    depends_on:
      scylla-node2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES;' && curl -sf http://$$(hostname -i):8000 -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  aws-client:
    image: amazon/aws-cli
    container_name: aws-client
    entrypoint: /bin/bash
    command: -c "tail -f /dev/null"
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: us-east-1
    networks:
      - dynamo-ring
    depends_on:
      scylla-node3:
        condition: service_healthy

networks:
  dynamo-ring:
    name: pacelc-dynamo-network
    driver: bridge